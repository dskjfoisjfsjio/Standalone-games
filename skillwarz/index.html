<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Skillwarz - Githack Edition</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        #debug { position: absolute; top: 10px; left: 10px; font-size: 11px; color: #333; }
        .terminal { border: 1px solid #333; padding: 30px; background: #050505; text-align: center; }
        .bar { width: 250px; height: 4px; background: #111; margin: 20px 0; }
        #fill { width: 0%; height: 100%; background: #0f0; }
        #canvas { width: 100vw; height: 100vh; display: none; }
        button { display: none; padding: 12px 30px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="debug">GITHACK NODE ACTIVE...</div>

    <div id="ui" class="terminal">
        <div id="status">PULLING SKILLWARZ ASSETS...</div>
        <div class="bar"><div id="fill"></div></div>
        <button id="run">START GAME</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
    const log = (m) => { document.getElementById('debug').innerHTML += `<br>> ${m}`; };
    
    // Raw Githack Path
    const BASE = "https://raw.githack.com/dskjfoisjfsjio/Standalone-games/main/skill/";
    
    const ASSETS = {
        "wasm": { name: "73611fcc7c7b8b3610837876d55a0a40.wasm", parts: 2 },
        "loader": "c4ce55f6fd90c1236bc84106eb955bf.loader.js",
        "framework": "604ae7f9abd9cae1b3356d447c52b6b2.framework.js.br"
    };

    let blobs = {};

    async function load() {
        try {
            let chunks = [];
            for (let i = 1; i <= ASSETS.wasm.parts; i++) {
                const r = await fetch(`${BASE}${ASSETS.wasm.name}.part${i}`);
                if (!r.ok) throw new Error(`404: Part ${i}`);
                chunks.push(await r.arrayBuffer());
                document.getElementById('fill').style.width = `${(i / 2) * 100}%`;
                log(`Captured segment ${i}`);
            }
            blobs[ASSETS.wasm.name] = URL.createObjectURL(new Blob(chunks, { type: "application/wasm" }));

            const script = document.createElement("script");
            script.src = BASE + ASSETS.loader;
            script.onload = () => {
                document.getElementById('status').innerText = "STABLE";
                document.getElementById('run').style.display = "inline-block";
            };
            document.body.appendChild(script);
        } catch (e) { log(`FAIL: ${e.message}`); }
    }

    document.getElementById('run').onclick = () => {
        document.getElementById('ui').style.display = 'none';
        document.getElementById('canvas').style.display = 'block';
        launch();
    };

    function launch() {
        const originalFetch = window.fetch;
        window.fetch = (input, init) => {
            let url = typeof input === 'string' ? input : input.url;
            const filename = url.split('/').pop();

            if (filename.includes("73611fcc7c7b8b3610837876d55a0a40")) {
                return originalFetch(blobs[ASSETS.wasm.name]).then(r => 
                    new Response(r.body, { headers: { 'Content-Type': 'application/wasm' } })
                );
            }
            if (!url.startsWith('blob:') && !url.startsWith('http')) {
                return originalFetch(BASE + filename, init);
            }
            return originalFetch(input, init);
        };

        const config = {
            frameworkUrl: BASE + ASSETS.framework,
            codeUrl: blobs[ASSETS.wasm.name],
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Skillwarz",
            productVersion: "1.0",
        };

        createUnityInstance(document.getElementById("canvas"), config, (p) => {});
    }

    load();
    </script>
</body>
</html>
